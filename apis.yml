  properties:
  - url: https://developer.capitalone.com/products/account-lookup?id=24064-1
    type: Documentation
  - url: graphql/capital-one-graphql.md
    type: GraphQL
  description: The Capital One Account Lookup API is a DevExchange product that lets
    approved partners resolve and retrieve consumer account information such as balances,
    transaction history, and account status. Integrators use it to surface up-to-date
    Capital One account details inside partner applications and dashboards. Access
    is secured with OAuth 2.0 client credentials, exercised first in the DevExchange
    sandbox and then promoted to production after partner approval. Documentation is
    HTML-only on the DevExchange portal; no downloadable OpenAPI is published.
- aid: capital-one:authorizations-api
  name: Capital One Authorizations API
  tags:
  - Authorizations
  - Payments
  - United States
  baseURL: https://api-sandbox.capitalone.com
  humanURL: https://developer.capitalone.com/products/authorizations?id=658618-1
  properties:
  - url: https://developer.capitalone.com/documentation/o-auth
    type: Documentation
  description: The Capital One Authorizations API lets approved partners programmatically
    validate and authorize financial transactions against Capital One's platform in
    real time. It supports payment authorization decisioning and fraud-reduction workflows
    for merchants and fintechs integrating with Capital One card products. Access is
    OAuth 2.0 secured through DevExchange, with a sandbox for pre-production testing
    and a partner-approval gate for production. Reference material is HTML documentation
    on the portal; there is no publicly downloadable machine-readable specification.
- aid: capital-one:credit-offers-api
  name: Capital One Credit Offers API
  tags:
  - Credit Cards
  - Credit Offers
  - United States
  baseURL: https://api-sandbox.capitalone.com
  humanURL: https://developer.capitalone.com/products/credit-offers?id=3105-3
  properties:
