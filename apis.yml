    type: Documentation
  description: The Capital One Credit Offers API provides approved partners programmatic
    access to Capital One credit card offers, including rewards programs, interest
    rates, fees, and eligibility criteria. Partners integrate it to present personalized
    Capital One card recommendations inside their own experiences. Like the rest of
    the DevExchange catalog it is OAuth 2.0 secured, exercised in a sandbox, and gated
    behind partner approval for production. Documentation is HTML-only on the portal
    with no downloadable OpenAPI or Swagger definition available publicly.
