description: Capital One is a US money-center bank and financial services company offering
  credit cards, checking and savings accounts, loans, and auto financing. Through the
  Capital One DevExchange developer program the bank publishes a catalog of partner-facing
  production APIs for account lookup, transaction authorizations, credit offers, customer
  transactions, credit card applications, auto financing, proactive prescreen, partner
  account summary, shop with rewards, and public key sharing for client authentication.
  Access is secured with OAuth 2.0 and a public sandbox supports pre-production integration,
  with production access gated behind partner approval. Developer documentation is HTML-only
  (the portal is a single-page app); Capital One does not publish downloadable OpenAPI
  specifications. As an FDX member, Capital One also supports consumer-permissioned
  open-finance data access through aggregators in the US voluntary open-banking context.
