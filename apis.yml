    type: Documentation
  description: The Capital One Digital Auto Financing Credit Application API lets approved
    partners such as dealers and auto-marketplaces submit and process auto loan applications
    through Capital One's digital financing platform. It automates the credit application,
    verification, and approval flow so customers can be financed at the point of purchase.
    Access is OAuth 2.0 secured through DevExchange, tested in a sandbox and gated behind
    partner approval. Documentation is HTML-only on the portal; there is no publicly
