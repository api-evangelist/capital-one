  - url: https://developer.capitalone.com/products/data-protection-and-client-authentication-public-key-sharing?id=9721-1
    type: Documentation
  description: The Capital One Data Protection and Client Authentication Public Key
    Sharing API lets integrating clients securely exchange public keys with Capital
    One to establish encrypted, authenticated communication for sensitive data in transit.
    It is a supporting security primitive for the broader DevExchange API catalog rather
    than a business-data endpoint. Access is OAuth 2.0 secured with sandbox testing
    and partner approval for production. Documentation is HTML-only on the DevExchange
    portal and no downloadable OpenAPI definition is published.
