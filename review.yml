reviewer: API Evangelist
date: '2026-07-23'
provider: capital-one
summary: >-
  Capital One operates a real, partner-facing public developer program under the
  Capital One DevExchange brand (developer.capitalone.com, HTTP 200). The portal
  documents a catalog of production API products spanning consumer banking, cards,
  payments, lending, and rewards. This review deepens the existing 14 DevExchange
  product entries with documented base URL, segment tags, and verified provider
  links; no new/unverified products were fabricated.
developer_portal: https://developer.capitalone.com/
developer_portal_status: 200
findings:
  api_surface:
    type: first-party-developer-portal
    program: Capital One DevExchange
    products_documented: 14
    products:
    - Account Lookup API
    - Authorizations API
    - Credit Offers API
    - Customer Transactions
    - Data Protection and Client Authentication Public Key Sharing API
    - Digital Auto Financing Credit Application API
    - Enhanced Decisioning Data API
    - In-Store Credit Card Payments API
    - POS Credit Card Application API
    - Partner Account Summary API
    - Pre-Application Orchestrator API
    - Real-Time Proactive Prescreen API
    - Retrieve Consumer Bank Products API
    - Shop with Rewards API
    note: >-
      Each product has a real DevExchange product page (humanURL with a stable
      product id) that returned HTTP 200. The portal is a single-page Angular app,
      so all documentation is client-rendered HTML — product detail cannot be
      server-scraped and there is no per-product static reference document.
  base_url:
    sandbox: https://api-sandbox.capitalone.com
    sandbox_status: 403
    note: >-
      The DevExchange sandbox gateway host resolves and returns HTTP 403 (auth
      required), confirming it exists. The production root api.capitalone.com
      returned 404 at the bare host (gateway only responds on authenticated
      product paths). baseURL on each API entry is set to the documented sandbox
      gateway host.
  auth_model:
    scheme: OAuth 2.0
    documentation: https://developer.capitalone.com/documentation/o-auth
    additional: >-
      Public-key sharing product supports client authentication / data-protection
      key exchange. Sandbox available at
      https://developer.capitalone.com/documentation/sandbox; production access is
      gated behind partner approval.
  downloadable_specs:
    openapi: false
    swagger: false
    postman: false
    harvested: 0
    note: >-
      No publicly downloadable OpenAPI/Swagger/Postman artifact is published by
      Capital One. Documentation is HTML-only inside the SPA. No specs were
      harvested; none were fabricated. (A third-party api-evangelist Postman
      collection exists but is not a first-party Capital One artifact.)
  llms_txt:
    claimed: https://developer.capitalone.com/llms.txt
    real: false
    note: >-
      The prior apis.yml carried an LlmsText pointer to developer.capitalone.com/llms.txt.
      Fetching that path returns the SPA index shell (the Angular catch-all), not a
      real llms.txt file, so the pointer was removed as unverified.
  open_finance_posture:
    fdx_member: true
    stated_1033_posture: >-
      Capital One is a US money-center bank subject to the CFPB Section 1033
      personal financial data rights framework; it participates in the US
      voluntary open-finance ecosystem rather than a single mandated contract.
    aggregator_access:
    - Plaid
    - Akoya
    - Finicity
    note: >-
      Consumer-permissioned account/transaction data access is available to
      third parties primarily via aggregators and FDX-aligned connectivity, in
      addition to the partner-gated DevExchange product APIs. Exact aggregator
      list reflects public open-banking coverage reporting, not a Capital One
      published directory.
  verified_links:
  - {type: DeveloperPortal, url: 'https://developer.capitalone.com/', status: 200}
  - {type: Website, url: 'https://www.capitalone.com/', status: 200}
  - {type: GettingStarted, url: 'https://developer.capitalone.com/documentation/getting-started', status: 200}
  - {type: OAuth20, url: 'https://developer.capitalone.com/documentation/o-auth', status: 200}
  - {type: Sandbox, url: 'https://developer.capitalone.com/documentation/sandbox', status: 200}
  - {type: Support, url: 'https://developer.capitalone.com/help/tickets', status: 200}
  - {type: GitHubOrganization, url: 'https://github.com/capitalone', status: 200}
  - {type: Blog, url: 'https://www.capitalone.com/tech/blog/', status: 200}
  - {type: TermsOfService, url: 'https://www.capitalone.com/legal/terms-conditions/', status: 200}
  - {type: PrivacyPolicy, url: 'https://www.capitalone.com/privacy/', status: 200}
  tier: money-center
  segment: consumer-banking
