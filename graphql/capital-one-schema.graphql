# ─── Root Types ──────────────────────────────────────────────────────────────

type Query {
  # Account queries
  account(id: ID!): Account
  accounts(customerId: ID!): [Account!]!
  checkingAccount(id: ID!): CheckingAccount
  savingsAccount(id: ID!): SavingsAccount
  creditCard(id: ID!): CreditCard
  autoLoan(id: ID!): AutoLoan
  mortgage(id: ID!): Mortgage
  personalLoan(id: ID!): PersonalLoan

  # Balance queries
  accountBalance(accountId: ID!): AccountBalance!
  availableBalance(accountId: ID!): AvailableBalance!
  pendingBalance(accountId: ID!): PendingBalance!
  statementBalance(accountId: ID!): StatementBalance

  # Transaction queries
  transaction(id: ID!): Transaction
  transactions(accountId: ID!, limit: Int, offset: Int, startDate: Date, endDate: Date, type: TransactionType): [Transaction!]!

  # Rewards queries
  rewards(accountId: ID!): Reward
  rewardRedemptions(rewardId: ID!): [RewardRedemption!]!
  offers(accountId: ID!): [Offer!]!

  # Credit queries
  creditScore(customerId: ID!): CreditScore
  creditMonitor(customerId: ID!): CreditMonitor
  idProtection(customerId: ID!): IDProtection
  creditLimit(accountId: ID!): CreditLimit!
  spendingLimit(accountId: ID!): SpendingLimit

  # Card queries
  card(id: ID!): Card
  cards(accountId: ID!): [Card!]!
  virtualCards(cardId: ID!): [VirtualCard!]!

  # Payment queries
  autoPay(accountId: ID!): AutoPay
  paymentMethods(customerId: ID!): [PaymentMethod!]!

  # Customer queries
  customer(id: ID!): Customer
  customerProfile(customerId: ID!): CustomerProfile

  # Notification/Document queries
  notifications(customerId: ID!, unreadOnly: Boolean): [Notification!]!
  alerts(customerId: ID!, unreadOnly: Boolean): [Alert!]!
  statements(accountId: ID!, limit: Int): [Statement!]!
  taxDocuments(customerId: ID!, taxYear: Int): [TaxDocument!]!

  # Platform queries
  apiKeys(clientId: String!): [APIKey!]!
  webhooks(clientId: String!): [Webhook!]!
  openBankingConsents(customerId: ID!): [OpenBanking!]!
  privacy(customerId: ID!): Privacy
  dataTransparency(customerId: ID!): [DataTransparency!]!
}

type Mutation {
  # Account mutations
  updateAccountNickname(accountId: ID!, nickname: String!): Account!

  # Transfer mutations
  initiateTransfer(fromAccountId: ID!, toAccountId: ID!, amount: Decimal!, memo: String): Transfer!
  initiateZelle(fromAccountId: ID!, recipientToken: String!, amount: Decimal!, memo: String): Zelle!
  initiateWireTransfer(fromAccountId: ID!, beneficiaryName: String!, beneficiaryBank: String!, routingNumber: String, accountNumber: String, swift: String, amount: Decimal!, reference: String): WireTransfer!

  # Payment mutations
  makePayment(accountId: ID!, paymentMethodId: ID!, amount: Decimal!): Payment!
  enrollAutoPay(accountId: ID!, paymentMethodId: ID!, paymentAmount: String!, frequency: PaymentFrequency!, paymentDay: Int): AutoPay!
  cancelAutoPay(accountId: ID!): Boolean!

  # Card mutations
  lockCard(cardId: ID!, reason: String): CardLock!
  unlockCard(cardId: ID!): CardLock!
  createVirtualCard(parentCardId: ID!, merchantLock: String, spendLimit: Decimal): VirtualCard!
  cancelVirtualCard(virtualCardId: ID!): VirtualCard!
  addAuthorizedUser(accountId: ID!, firstName: String!, lastName: String!, dateOfBirth: Date!, relationship: String, spendLimit: Decimal): AuthorizedUser!
  removeAuthorizedUser(authorizedUserId: ID!): Boolean!

  # Reward mutations
  redeemCashBack(rewardId: ID!, amount: Decimal!, redemptionType: String!): RewardRedemption!
  activateOffer(offerId: ID!): Offer!

  # Notification mutations
  markNotificationRead(notificationId: ID!): Notification!
  markAlertDismissed(alertId: ID!): Alert!
  updateNotificationPreferences(customerId: ID!, channels: [NotificationChannel!]!): Customer!

  # Platform mutations
  createWebhook(clientId: String!, url: String!, events: [String!]!): Webhook!
  deleteWebhook(webhookId: ID!): Boolean!
  revokeOpenBankingConsent(consentId: ID!): OpenBanking!
  updatePrivacySettings(customerId: ID!, marketingOptOut: Boolean, dataSharingOptOut: Boolean, targetedAdsOptOut: Boolean): Privacy!
