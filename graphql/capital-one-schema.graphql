# Capital One GraphQL Schema
# Conceptual schema representing Capital One's banking, credit, and financial services APIs
# Developer Portal: https://developer.capitalone.com/
# GitHub: https://github.com/capitalone

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar DateTime
scalar Date
scalar Decimal
scalar JSON

# ─── Enums ──────────────────────────────────────────────────────────────────

enum AccountStatus {
  ACTIVE
  CLOSED
  FROZEN
  PENDING
  RESTRICTED
}

enum AccountType {
  CHECKING
  SAVINGS
  CREDIT_CARD
  AUTO_LOAN
  MORTGAGE
  PERSONAL_LOAN
}

enum TransactionStatus {
  PENDING
  POSTED
  DECLINED
  REVERSED
  CANCELLED
}

enum TransactionType {
  PURCHASE
  PAYMENT
  TRANSFER
  ZELLE
  WIRE_TRANSFER
  ACH
  CHECK_DEPOSIT
  STATEMENT_CREDIT
  FEE
  INTEREST
  REFUND
}

enum RewardType {
  CASH_BACK
  MILES
  POINTS
}

enum CardStatus {
  ACTIVE
  LOCKED
  CANCELLED
  EXPIRED
  REPLACED
}

enum AlertSeverity {
  INFO
  WARNING
  CRITICAL
}

enum NotificationChannel {
  EMAIL
  SMS
  PUSH
  IN_APP
}

enum PaymentFrequency {
  WEEKLY
  BIWEEKLY
  MONTHLY
  QUARTERLY
}

enum DocumentType {
  STATEMENT
  TAX_1099_INT
  TAX_1099_DIV
  TAX_1098
  NOTICE
}

enum OfferCategory {
  DINING
  TRAVEL
  GROCERY
  GAS
  ENTERTAINMENT
  SHOPPING
  UTILITIES
  OTHER
}

enum ConsentStatus {
  GRANTED
  REVOKED
  PENDING
  EXPIRED
}

# ─── Account Domain ──────────────────────────────────────────────────────────

interface Account {
  id: ID!
  accountNumber: String!
  routingNumber: String
  type: AccountType!
  status: AccountStatus!
  nickname: String
  openedDate: Date
  balance: AccountBalance!
  customer: Customer!
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): [Transaction!]!
  statements: [Statement!]!
  notifications: [Notification!]!
}

